# .gitleaks.toml
title = "Filmorate Gitleaks Config"

# Начинаем с набора правил по умолчанию
[extend]
useDefault = true

# --- Глобальные исключения ---
# Здесь мы можем указать файлы, которые не нужно сканировать.
# Например, сам файл конфигурации, чтобы не было рекурсии.
[allowlist]
description = "Global allowlist"
paths = [
    '''\.gitleaks\.toml$''',
]

# --- Кастомные правила ---
# Добавляем правило для Stripe, которое ищет ключи любой длины (24+ символа)
[[rules]]
id = "stripe-custom-key"
description = "Stripe API Key (Custom)"
regex = '''sk_live_[0-9a-zA-Z]{24,}'''
tags = ["key", "stripe"]

# Добавляем правило для AWS, которое ищет ключи с префиксом AKIA и 16 символами
# Мы используем расширенный набор префиксов, чтобы поймать больше ключей
[[rules]]
id = "aws-access-key-custom"
description = "AWS Access Key ID (Custom)"
regex = '''(?:A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}'''
tags = ["key", "AWS"]

# Добавляем правило для AWS Secret Key, которое ищет ключи после "secret_access_key"
[[rules]]
id = "aws-secret-key-custom"
description = "AWS Secret Access Key (Custom)"
regex = '''(?i)aws_secret_access_key\s*[:=]\s*['"]?([A-Za-z0-9/+=]{40})['"]?'''
secretGroup = 1
tags = ["key", "AWS"]